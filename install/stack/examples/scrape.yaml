# VictoriaMetrics scrape configuration (Prometheus format).
# Reload after editing with: sudo systemctl reload victoria-metrics
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  - job_name: bme280mon
    static_configs:
      - targets: ['127.0.0.1:9101']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: victoriametrics
    static_configs:
      - targets: ['127.0.0.1:8428']
